name: Enterprise Agentic RAG CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: enterprise-agentic-rag


# ============================================================
# JOB 1 — PYTHON TESTS
# ============================================================

jobs:

  test:

    name: Python Tests

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------

      - name: Run pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "enterprise-agentic-rag-ci"

        run: |
          pytest -v


# ============================================================
# JOB 2 — DOCKER BUILD
# ============================================================

  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - test

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |
          docker build \
            --build-arg GROQ_API_KEY="${GROQ_API_KEY}" \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .


      # --------------------------------------------------------
      # Verify Docker image
      # --------------------------------------------------------

      - name: Verify Docker image
        run: |
          docker images $IMAGE_NAME


# ============================================================
# JOB 3 — DOCKER IMAGE PUSH TO GHCR
# ============================================================

  docker-push:

    name: Push Docker Image to GHCR

    runs-on: ubuntu-latest

    needs:
      - docker-build

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Build and push image
      # --------------------------------------------------------

      - name: Build and push Docker image
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |

          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}

          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')

          echo "Building image:"
          echo "$IMAGE_ID"

          docker build \
            --build-arg GROQ_API_KEY="${GROQ_API_KEY}" \
            -t "$IMAGE_ID:${{ github.sha }}" \
            -t "$IMAGE_ID:latest" \
            .

          docker push "$IMAGE_ID:${{ github.sha }}"

          docker push "$IMAGE_ID:latest"


# ============================================================
# JOB 4 — CI SUMMARY
# ============================================================

  ci-summary:

    name: CI Summary

    runs-on: ubuntu-latest

    needs:
      - test
      - docker-build
      - docker-push

    steps:

      - name: CI completed successfully
        run: |

          echo "=============================================="
          echo "ENTERPRISE AGENTIC RAG CI/CD"
          echo "=============================================="

          echo ""
          echo "Python tests: PASSED"
          echo "Docker build: PASSED"
          echo "Docker image: PUSHED"
          echo ""

          echo "Image:"
          echo "ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"

          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"

          echo "=============================================="