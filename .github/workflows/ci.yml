name: Enterprise Agentic RAG CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  # ==========================================================
  # TEST JOB
  # ==========================================================

  test:

    name: Python Tests

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # Pip cache
      # ------------------------------------------------------

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip

          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

          restore-keys: |
            ${{ runner.os }}-pip-


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # Run tests
      # ------------------------------------------------------

      - name: Run pytest
        run: |
          pytest -vv


  # ==========================================================
  # DOCKER JOB
  # ==========================================================

  docker:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Build Docker image
      # ------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t enterprise-agentic-rag:ci .


      # ------------------------------------------------------
      # Verify image
      # ------------------------------------------------------

      - name: Verify Docker image
        run: |
          docker image inspect enterprise-agentic-rag:ci


      # ------------------------------------------------------
      # Display image information
      # ------------------------------------------------------

      - name: Docker image information
        run: |
          docker images enterprise-agentic-rag:ci