name: Deploy Enterprise Agentic RAG

on:
  workflow_dispatch:

    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: read

jobs:

  deploy:

    name: Production Deployment Smoke Test

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Login to GHCR
      # ======================================================

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 3. Pull Docker image
      # ======================================================

      - name: Pull Docker image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/enterprise-agentic-rag-llmops:${{ inputs.image_tag }}"

          echo "Pulling image:"
          echo "$IMAGE"

          docker pull "$IMAGE"


      # ======================================================
      # 4. Verify Docker image
      # ======================================================

      - name: Verify Docker image
        run: |

          IMAGE="ghcr.io/${{ github.repository_owner }}/enterprise-agentic-rag-llmops:${{ inputs.image_tag }}"

          docker image inspect "$IMAGE"

          echo "Docker image verified successfully."


      # ======================================================
      # 5. Start container
      # ======================================================

      - name: Start Enterprise Agentic RAG
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}

        run: |

          IMAGE="ghcr.io/${{ github.repository_owner }}/enterprise-agentic-rag-llmops:${{ inputs.image_tag }}"

          docker run -d \
            --name enterprise-agentic-rag \
            -p 8000:8000 \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            -e LANGCHAIN_API_KEY="$LANGCHAIN_API_KEY" \
            -e LANGCHAIN_TRACING_V2="$LANGCHAIN_TRACING_V2" \
            -e LANGCHAIN_PROJECT="$LANGCHAIN_PROJECT" \
            "$IMAGE"

          echo "Container started."

          docker ps


      # ======================================================
      # 6. Show container logs
      # ======================================================

      - name: Show initial container logs
        run: |

          sleep 5

          docker logs enterprise-agentic-rag


      # ======================================================
      # 7. Wait for API
      # ======================================================

      - name: Wait for API
        run: |

          echo "Waiting for FastAPI..."

          for i in {1..30}; do

            echo "Attempt $i/30"

            if curl --fail --silent http://localhost:8000/health; then

              echo ""
              echo "API is healthy!"

              exit 0

            fi

            sleep 5

          done

          echo "API failed to start."

          echo "========== CONTAINER STATUS =========="

          docker ps -a

          echo "========== CONTAINER LOGS =========="

          docker logs enterprise-agentic-rag

          exit 1


      # ======================================================
      # 8. Test root endpoint
      # ======================================================

      - name: Test root endpoint
        run: |

          echo "Testing / endpoint..."

          curl --fail \
            http://localhost:8000/

          echo ""


      # ======================================================
      # 9. Test health endpoint
      # ======================================================

      - name: Test health endpoint
        run: |

          echo "Testing /health endpoint..."

          curl --fail \
            http://localhost:8000/health

          echo ""


      # ======================================================
      # 10. Test /ask endpoint
      # ======================================================

      - name: Test ask endpoint
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |

          echo "Testing /ask endpoint..."

          curl --fail \
            -X POST \
            http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question":"What is the Transformer architecture?"}'

          echo ""


      # ======================================================
      # 11. Show final logs
      # ======================================================

      - name: Show application logs
        if: always()
        run: |

          echo "========== FINAL CONTAINER LOGS =========="

          docker logs enterprise-agentic-rag || true


      # ======================================================
      # 12. Cleanup
      # ======================================================

      - name: Stop container
        if: always()
        run: |

          docker stop enterprise-agentic-rag || true

          docker rm enterprise-agentic-rag || true

          echo "Container cleaned up."