name: Deploy Enterprise Agentic RAG

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

jobs:

  deploy:
    name: Deploy and Test Docker Image

    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      packages: read

    steps:

      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Login to GitHub Container Registry
      # ======================================================

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 3. Pull Docker image
      # ======================================================

      - name: Pull Docker image
        run: |
          echo "Pulling image..."

          docker pull \
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}


      # ======================================================
      # 4. Verify Docker image
      # ======================================================

      - name: Verify Docker image
        run: |
          echo "========== DOCKER IMAGES =========="

          docker images

          echo ""
          echo "========== IMAGE INSPECTION =========="

          docker image inspect \
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}


      # ======================================================
      # 5. Start Docker container
      # ======================================================

      - name: Start application container
        run: |
          echo "Starting Enterprise Agentic RAG container..."

          docker run -d \
            --name enterprise-agentic-rag \
            -p 8000:8000 \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}


      # ======================================================
      # 6. Check container status
      # ======================================================

      - name: Check container status
        run: |
          echo "========== CONTAINER STATUS =========="

          docker ps -a

          echo ""
          echo "========== INITIAL LOGS =========="

          docker logs enterprise-agentic-rag


      # ======================================================
      # 7. Debug FastAPI routes
      # ======================================================

      - name: Debug FastAPI routes
        run: |
          echo "Waiting 5 seconds for application..."
          sleep 5

          echo ""
          echo "========== FASTAPI ROUTES =========="

          docker exec enterprise-agentic-rag \
            python -c "from app.api.main import app; print([route.path for route in app.routes])"


      # ======================================================
      # 8. Wait for API
      # ======================================================

      - name: Wait for API
        run: |
          echo "Waiting for FastAPI..."

          for i in {1..30}; do

            echo "Attempt $i/30"

            if curl --fail --silent http://localhost:8000/health; then

              echo ""
              echo "======================================"
              echo "API IS HEALTHY"
              echo "======================================"

              exit 0

            fi

            sleep 5

          done

          echo ""
          echo "======================================"
          echo "API FAILED TO START"
          echo "======================================"

          echo ""
          echo "========== CONTAINER LOGS =========="

          docker logs enterprise-agentic-rag

          exit 1


      # ======================================================
      # 9. Test root endpoint
      # ======================================================

      - name: Test root endpoint
        run: |
          echo "========== TEST / =========="

          curl --fail \
            http://localhost:8000/

          echo ""
          echo "Root endpoint successful."


      # ======================================================
      # 10. Test health endpoint
      # ======================================================

      - name: Test health endpoint
        run: |
          echo "========== TEST /health =========="

          curl --fail \
            http://localhost:8000/health

          echo ""
          echo "Health endpoint successful."


      # ======================================================
      # 11. Test Agentic RAG endpoint
      # ======================================================

      - name: Test Agentic RAG endpoint
        run: |
          echo "========== TEST /ask =========="

          RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question":"What is the main contribution of the Transformer paper?"}')

          echo ""
          echo "========== RAG RESPONSE =========="

          echo "$RESPONSE"

          echo ""
          echo "Agentic RAG endpoint successful."


      # ======================================================
      # 12. Final container logs
      # ======================================================

      - name: Show container logs
        if: always()
        run: |
          echo "======================================"
          echo "FINAL CONTAINER STATUS"
          echo "======================================"

          docker ps -a

          echo ""
          echo "======================================"
          echo "FINAL CONTAINER LOGS"
          echo "======================================"

          docker logs enterprise-agentic-rag


      # ======================================================
      # 13. Stop container
      # ======================================================

      - name: Stop container
        if: always()
        run: |
          docker stop enterprise-agentic-rag || true
          docker rm enterprise-agentic-rag || true