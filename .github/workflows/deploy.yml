name: Deploy Enterprise Agentic RAG

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: read

jobs:

  deploy:
    name: Deploy Docker Image
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Login to GitHub Container Registry
      # ======================================================

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 3. Pull Docker image
      # ======================================================

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}


      # ======================================================
      # 4. Verify image
      # ======================================================

      - name: Verify Docker image
        run: |
          docker images

          docker image inspect \
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}


      # ======================================================
      # 5. Start application container
      # ======================================================

      - name: Start application container
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |

          docker run -d \
            --name enterprise-agentic-rag \
            -p 8000:8000 \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}


      # ======================================================
      # 6. Show running container
      # ======================================================

      - name: Check container
        run: |
          docker ps -a

          echo "======================================"
          echo "Container status"
          echo "======================================"

          docker inspect \
            --format='{{.State.Status}}' \
            enterprise-agentic-rag


      # ======================================================
      # 7. Wait for API health
      # ======================================================

      - name: Wait for API
        run: |

          echo "Waiting for FastAPI application..."

          for i in {1..30}; do

            echo "Attempt $i/30"

            if curl --fail --silent http://localhost:8000/health; then

              echo ""
              echo "======================================"
              echo "API is healthy!"
              echo "======================================"

              exit 0

            fi

            sleep 5

          done


          echo "======================================"
          echo "API failed to start"
          echo "======================================"

          echo "========== CONTAINER LOGS =========="

          docker logs enterprise-agentic-rag

          exit 1


      # ======================================================
      # 8. Test root endpoint
      # ======================================================

      - name: Test root endpoint
        run: |

          echo "Testing / endpoint..."

          curl --fail \
            http://localhost:8000/


      # ======================================================
      # 9. Test health endpoint
      # ======================================================

      - name: Test health endpoint
        run: |

          echo "Testing /health endpoint..."

          curl --fail \
            http://localhost:8000/health
      

            # ======================================================
      # 10. Test readiness endpoint
      # ======================================================

      - name: Test readiness endpoint
        run: |

          echo "Testing /ready endpoint..."

          curl --fail \
            http://localhost:8000/ready

            # ======================================================
      # Test metrics endpoint
      # ======================================================

      - name: Test metrics endpoint
        run: |

          echo "Testing /metrics endpoint..."

          curl --fail \
            http://localhost:8000/metrics

      # ======================================================
      # 11. Test RAG /ask endpoint
      # ======================================================

      - name: Test ask endpoint
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |

          echo "Testing /ask endpoint..."

          curl --fail \
            -X POST \
            http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question":"What is the Transformer architecture?"}'


      # ======================================================
      # 12. Display application logs
      # ======================================================

      - name: Display container logs
        if: always()
        run: |

          echo "======================================"
          echo "APPLICATION LOGS"
          echo "======================================"

          docker logs enterprise-agentic-rag


      # ======================================================
      # 13. Stop container
      # ======================================================

      - name: Stop container
        if: always()
        run: |

          docker stop enterprise-agentic-rag || true

          docker rm enterprise-agentic-rag || true


      # ======================================================
      # 14. Deployment summary
      # ======================================================

      - name: Deployment summary
        run: |

          echo "=============================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          echo "Application:"
          echo "Enterprise Agentic RAG"

          echo "Image:"
          echo "ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"

          echo "Environment:"
          echo "production"

          echo ""
          echo "Endpoints tested:"
          echo "/"
          echo "/health"
          echo "/ask"

          echo ""
          echo "Docker image successfully deployed and tested."

          echo "=============================================="